<div class="bg-gradient-hero hero-bg">
  <!-- Decorative blobs -->
  <div class="blob" style="width:400px;height:400px;background:hsl(38,92%,50%);top:-100px;right:-100px;"></div>
  <div class="blob" style="width:300px;height:300px;background:hsl(280,60%,60%);bottom:-50px;left:-80px;"></div>

  <div style="width:100%;max-width:440px;position:relative;z-index:1;">
    <!-- Logo -->
    <div style="text-align:center;margin-bottom:2rem;" class="animate-slide-up">
      <div class="animate-float" style="display:inline-flex;align-items:center;justify-content:center;
           width:80px;height:80px;border-radius:24px;
           background:white;box-shadow:0 12px 40px rgba(0,0,0,0.15);margin-bottom:1.25rem;">
        <span style="font-size:2.5rem;">🎓</span>
      </div>
      <h1 class="font-display" style="color:white;font-size:2.8rem;margin:0;letter-spacing:1px;
          text-shadow:0 2px 12px rgba(0,0,0,0.15);">AlfaGame</h1>
      <p style="color:rgba(255,255,255,0.85);margin-top:0.5rem;font-size:1rem;font-weight:600;">
        Plataforma de Alfabetização Gamificada
      </p>
    </div>

    <!-- Card -->
    <div class="card animate-slide-up" style="padding:2rem;animation-delay:0.1s;">
      <h2 style="font-size:1.35rem;font-weight:800;margin:0 0 0.35rem;">Bem-vindo de volta 👋</h2>
      <p style="color:var(--muted-fg);font-size:0.9rem;margin:0 0 1.75rem;">Entre com suas credenciais para acessar</p>

      <div style="display:flex;flex-direction:column;gap:1.1rem;">
        <div>
          <label class="label">E-mail</label>
          <input class="input" type="email" placeholder="professor@escola.com"
            [(ngModel)]="email" (keydown.enter)="handleLogin()" />
        </div>
        <div>
          <label class="label">Senha</label>
          <input class="input" type="password" placeholder="••••••••"
            [(ngModel)]="password" (keydown.enter)="handleLogin()" />
        </div>
        <button class="btn btn-primary btn-lg" style="width:100%;margin-top:0.5rem;"
          (click)="handleLogin()" [disabled]="loading">
          @if (loading) {
            <span style="display:inline-flex;gap:4px;align-items:center;">
              <span style="width:6px;height:6px;background:white;border-radius:50%;animation:pulse 0.8s 0s infinite;"></span>
              <span style="width:6px;height:6px;background:white;border-radius:50%;animation:pulse 0.8s 0.2s infinite;"></span>
              <span style="width:6px;height:6px;background:white;border-radius:50%;animation:pulse 0.8s 0.4s infinite;"></span>
            </span>
          } @else {
            Entrar →
          }
        </button>
      </div>
    </div>

    <p style="text-align:center;color:rgba(255,255,255,0.6);font-size:0.82rem;margin-top:1.5rem;">
      Plataforma desenvolvida para apoiar professores e terapeutas na alfabetização
    </p>
  </div>
</div>
