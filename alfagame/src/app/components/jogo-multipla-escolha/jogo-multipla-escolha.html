<div style="display:flex;flex-direction:column;gap:1.75rem;">

  <!-- Imagem -->
  <div style="display:flex;justify-content:center;">
    <div class="animate-float" style="width:130px;height:130px;border-radius:24px;
        background:#ffffff;border:none;
        display:flex;align-items:center;justify-content:center;font-size:5rem;
        box-shadow:0 8px 40px rgba(255,255,255,0.12),0 2px 8px rgba(0,0,0,0.8);">
      {{ palavraAtual.imagem }}
    </div>
  </div>

  <!-- Palavra -->
  <div style="text-align:center;">
    <div class="font-display" style="font-size:3.2rem;letter-spacing:8px;color:#ffffff;font-weight:900;">
      {{ palavraAtual.incompleta }}
    </div>
    <p style="color:#888;margin-top:0.5rem;font-weight:600;font-size:0.9rem;">Escolha a sílaba correta</p>
  </div>

  <!-- Opções -->
  <div style="display:flex;flex-direction:column;gap:0.75rem;">
    @for (opcao of palavraAtual.opcoes; track opcao) {
      <button [class]="getBtnClass(opcao)" (click)="selecionar(opcao)" [disabled]="feedback !== null"
        style="width:100%;padding:1rem;border-radius:0.75rem;font-family:'Fredoka One',cursive;
               font-size:1.8rem;cursor:pointer;transition:all 0.15s;border:2px solid rgba(255,255,255,0.1);
               background:rgba(255,255,255,0.05);color:#f0f0f0;
               box-shadow:0 2px 12px rgba(0,0,0,0.4);">
        {{ opcao }}
      </button>
    }
  </div>

  <!-- Feedback -->
  @if (feedback) {
    <div class="animate-pop-in" style="display:flex;align-items:center;gap:0.75rem;
        padding:0.9rem 1.1rem;border-radius:0.75rem;font-weight:700;"
      [style.background]="feedback === 'correto' ? 'rgba(76,175,80,0.15)' : 'rgba(244,67,54,0.15)'"
      [style.border]="feedback === 'correto' ? '1.5px solid #4caf50' : '1.5px solid #f44336'"
      [style.color]="feedback === 'correto' ? '#4caf50' : '#f44336'">
      <span style="font-size:1.3rem;">{{ feedback === 'correto' ? '✅' : '❌' }}</span>
      <span>{{ feedback === 'correto' ? 'Correto! Muito bem! 🎉' : 'Foi quase, tenta de novo! 💪' }}</span>
    </div>
  }
</div>
