<div style="display:flex;flex-direction:column;gap:2rem;">
  <!-- Imagem -->
  <div style="display:flex;justify-content:center;">
    <div class="animate-float" style="width:130px;height:130px;border-radius:24px;
        background:hsl(210,40%,96%);border:2px solid var(--border);
        display:flex;align-items:center;justify-content:center;font-size:5rem;">
      {{ palavraAtual.imagem }}
    </div>
  </div>

  <!-- Palavra -->
  <div style="text-align:center;">
    <div class="font-display" style="font-size:3.5rem;letter-spacing:8px;color:var(--foreground);">
      {{ palavraAtual.incompleta }}
    </div>
    <p style="color:var(--muted-fg);margin-top:0.75rem;font-weight:600;">Complete a palavra</p>
  </div>

  <!-- Input -->
  <div style="display:flex;flex-direction:column;gap:1rem;">
    <input
      type="text"
      [value]="resposta"
      (input)="resposta = $any($event.target).value.toUpperCase()"
      (keydown.enter)="verificar()"
      [disabled]="feedback !== null"
      maxlength="2"
      placeholder="??"
      autofocus
      style="text-align:center;font-family:'Fredoka One',cursive;font-size:2.5rem;font-weight:900;
        padding:1rem;border-radius:var(--radius);border:3px solid;outline:none;
        width:100%;letter-spacing:8px;transition:all 0.2s;"
      [style.border-color]="feedback === 'correto' ? 'hsl(142,76%,36%)' : feedback === 'incorreto' ? 'hsl(0,84%,60%)' : 'var(--border)'"
      [style.background]="feedback === 'correto' ? 'hsl(142 76% 36% / 0.08)' : feedback === 'incorreto' ? 'hsl(0 84% 60% / 0.08)' : 'white'"
      [style.color]="feedback === 'correto' ? 'hsl(142,76%,36%)' : feedback === 'incorreto' ? 'hsl(0,84%,60%)' : 'var(--foreground)'"
    />

    @if (feedback) {
      <div class="feedback-box animate-pop-in" [class]="feedback">
        <span style="font-size:1.4rem;">{{ feedback === 'correto' ? '✅' : '❌' }}</span>
        <span>{{ feedback === 'correto' ? 'Correto! Excelente!' : 'Tente novamente' }}</span>
      </div>
    }

    <button class="btn btn-primary btn-lg" (click)="verificar()" [disabled]="!resposta || feedback !== null">
      Verificar Resposta
    </button>
  </div>
</div>
