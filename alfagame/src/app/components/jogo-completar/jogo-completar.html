<div style="display:flex;flex-direction:column;gap:1.75rem;">

  <!-- Imagem da palavra (com fallback emoji) -->
  <div style="display:flex;justify-content:center;">
    <div class="animate-float" style="width:160px;height:160px;border-radius:24px;
        background:#ffffff;overflow:hidden;
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 8px 40px rgba(255,255,255,0.12),0 2px 8px rgba(0,0,0,0.8);">
      <img [src]="palavraAtual.imagem" [alt]="palavraAtual.completa"
        style="width:100%;height:100%;object-fit:cover;"
        [hidden]="imgError"
        (error)="imgError = true">
      <div style="width:100%;height:100%;align-items:center;
          justify-content:center;font-size:5.5rem;"
        [style.display]="imgError ? 'flex' : 'none'">
        {{ palavraAtual.emoji }}
      </div>
    </div>
  </div>

  <!-- Palavra (incompleta → completa ao acertar) -->
  <div style="text-align:center;">
    <div class="font-display"
      style="font-size:3.2rem;letter-spacing:8px;font-weight:900;transition:color 0.25s;"
      [style.color]="feedback === 'correto' ? '#4caf50' : feedback === 'incorreto' ? '#f44336' : '#ffffff'"
      [class.animate-pop-in]="feedback === 'correto'">
      {{ feedback === 'correto' ? palavraAtual.completa.toUpperCase() : palavraAtual.incompleta }}
    </div>
    <p style="color:#888;margin-top:0.5rem;font-weight:600;font-size:0.9rem;">Complete a palavra</p>
  </div>

  <!-- Input + botão -->
  <div style="display:flex;flex-direction:column;gap:1rem;">
    <input
      type="text"
      [value]="resposta"
      (input)="resposta = $any($event.target).value.toUpperCase()"
      (keydown.enter)="verificar()"
      [disabled]="feedback !== null"
      maxlength="2"
      placeholder="??"
      autofocus
      style="text-align:center;font-family:'Fredoka One',cursive;font-size:2.5rem;font-weight:900;
        padding:1rem;border-radius:0.75rem;letter-spacing:8px;outline:none;width:100%;
        transition:all 0.2s;border:2px solid;box-shadow:0 2px 20px rgba(0,0,0,0.5);"
      [style.background]="feedback === 'correto' ? 'rgba(76,175,80,0.15)' : feedback === 'incorreto' ? 'rgba(244,67,54,0.15)' : 'rgba(255,255,255,0.06)'"
      [style.border-color]="feedback === 'correto' ? '#4caf50' : feedback === 'incorreto' ? '#f44336' : 'rgba(255,255,255,0.12)'"
      [style.color]="feedback === 'correto' ? '#4caf50' : feedback === 'incorreto' ? '#f44336' : '#ffffff'"
    />

    @if (feedback) {
      <div class="animate-pop-in" style="display:flex;align-items:center;gap:0.75rem;
          padding:0.9rem 1.1rem;border-radius:0.75rem;font-weight:700;"
        [style.background]="feedback === 'correto' ? 'rgba(76,175,80,0.15)' : 'rgba(244,67,54,0.15)'"
        [style.border]="feedback === 'correto' ? '1.5px solid #4caf50' : '1.5px solid #f44336'"
        [style.color]="feedback === 'correto' ? '#4caf50' : '#f44336'">
        <span style="font-size:1.3rem;">{{ feedback === 'correto' ? '✅' : '❌' }}</span>
        <span>{{ feedback === 'correto' ? 'Correto! Excelente! 🎉' : 'Foi quase, tenta de novo! 💪' }}</span>
      </div>
    }

    <button class="btn btn-primary btn-lg" (click)="verificar()"
      [disabled]="!resposta || feedback !== null"
      style="border-radius:0.75rem;">
      Verificar Resposta
    </button>
  </div>
</div>
